spring.application.name=BankingService

spring.datasource.url=jdbc:mysql://localhost:3306/Bankdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


info.app.name=Banking Service
info.app.description=REST APIs for bank account and transaction management
info.app.version=1.0.0

info.developer.name=Haritha Kondu
info.developer.email=harithakondu@email.com


management.info.env.enabled=true

# Enable actuator endpoints
management.endpoints.web.exposure.include=*

# Optional: Change default actuator base path (default is /actuator)
# management.endpoints.web.base-path=/management

# Enable tracing
management.tracing.enabled=true

# Sample all traces (adjust as needed for production)
management.tracing.sampling.probability=1.0

# Application name (shows in Zipkin UI)

# Zipkin endpoint (default when using Docker Zipkin)
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Optional: Use REST over HTTP (default is HTTP)
management.zipkin.tracing.sender-type=web
