spring.application.name=BankingService

spring.datasource.url=jdbc:mysql://localhost:3306/Bankdb
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


info.app.name=Banking Service
info.app.description=REST APIs for bank account and transaction management
info.app.version=1.0.0

info.developer.name=Haritha Kondu
info.developer.email=harithakondu@email.com


management.info.env.enabled=true

# Enable actuator endpoints
management.endpoints.web.exposure.include=*

# Optional: Change default actuator base path (default is /actuator)
# management.endpoints.web.base-path=/management


